[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "panaesthesis"
version = "0.13.1"
description = "A monitoring instrument for any system with internal relations: watch and reshape the relations between a system's parts through four information-geometry equations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Vektorgeist" }]
keywords = ["information-geometry", "monitoring", "relations", "interpretability"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
]
dependencies = ["numpy", "matplotlib", "pillow"]

[project.optional-dependencies]
torch = ["torch"]

[project.urls]
Homepage = "https://github.com/xfloukiex-lab/panaesthesis"

[tool.setuptools.packages.find]
include = ["hodos_monitor*"]
